#
# MODIFICAÇÃO NOSSA (declarada como exige a GPL):
#   - image do ambiente do aluno trocada para 'alpine/k8s:1.33.1' (multi-arch, ARM64).
#     Este lab não usa Kind aninhado — roda kubectl contra o cluster hospedeiro
#     (o nosso k3s) via a ServiceAccount girus-sa.
#   - Removidos os blocos de código (```) — diagrama cron ASCII, exemplos de saída e
#     manifestos YAML de referência — e as crases inline do texto dos steps: o frontend
#     do Girus renderiza qualquer trecho em crase/bloco como chip copiável isolado.
#     O comando imperativo (kubectl create cronjob) que já seguia cada manifesto foi
#     preservado. Negrito (**...**) renderiza como texto e foi mantido.
#   - Adicionados links da documentação oficial do Kubernetes nos tips.
#
# NOTA: o pod-terminal do Girus roda '/bin/bash -c tail -f /dev/null'; alpine/k8s
#       tem bash + kubectl + helm + curl, cobrindo os passos que pedem shell.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-cronjobs-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: |
    name: kubernetes-cronjobs
    title: "Lab 4 — CronJobs no Kubernetes"
    description: "Aprenda a criar e gerenciar CronJobs no Kubernetes, agendando tarefas para execução automática em intervalos definidos. Neste laboratório guiado, você aprenderá o conceito de CronJobs, sua sintaxe de agendamento, como configurar políticas de retenção de histórico e monitorar suas execuções."
    duration: 30m
    image: "alpine/k8s:1.33.1"
    privileged: true
    tasks:
      - name: "Conceitos de CronJobs no Kubernetes"
        description: "Compreenda o que são CronJobs, quando utilizá-los e como a sintaxe de agendamento funciona."
        steps:
          - "**O que são CronJobs no Kubernetes?**"
          - "CronJobs no Kubernetes são uma extensão dos Jobs regulares, permitindo que tarefas sejam executadas em horários específicos ou intervalos regulares, de forma semelhante aos cron jobs em sistemas Unix/Linux."
          - "**Características principais dos CronJobs:**"
          - "- Execução programada: realizam tarefas em horários específicos ou intervalos definidos"
          - "- Baseados em Jobs: cada execução de um CronJob cria um objeto Job"
          - "- Não interativos: ideais para tarefas em lote (backups, relatórios, limpeza de dados, etc.)"
          - "- Escalabilidade: o Kubernetes gerencia o ciclo de vida dos Pods criados"
          - "- Histórico de execuções: mantém registro das execuções anteriores"
          - "**Casos de uso comuns:**"
          - "- Geração de relatórios periódicos"
          - "- Backups programados"
          - "- Limpeza de dados"
          - "- Alertas e verificações de saúde"
          - "- Processamento em lote"
          - "- Sincronização de dados"
          - "**Sintaxe de agendamento (cron schedule):**"
          - "A sintaxe segue o formato tradicional do cron, com cinco campos separados por espaço, nesta ordem: minuto (0-59), hora (0-23), dia do mês (1-31), mês (1-12) e dia da semana (0-6, de Domingo a Sábado). Um asterisco em um campo significa 'todos os valores'. Assim, cinco asteriscos (* * * * *) executam a cada minuto."
          - "**Exemplos de expressões cron** (o valor à direita é a expressão a usar no campo schedule):"
          - "- A cada 5 minutos: */5 * * * *"
          - "- A cada 2 horas (0h, 2h, 4h, ...): 0 */2 * * *"
          - "- Diariamente à meia-noite: 0 0 * * *"
          - "- Semanalmente aos domingos à meia-noite: 0 0 * * 0"
          - "- Mensalmente no primeiro dia do mês: 0 0 1 * *"
          - "- Atalhos nomeados equivalentes: @hourly, @daily, @weekly, @monthly"
          - "Para validar seu entendimento, use o comando abaixo para ver a expressão de agendamento que o Kubernetes registra a partir de uma expressão cron:"
          - "`kubectl create cronjob --image=busybox --schedule='*/5 * * * *' cronjob-exemplo --dry-run=client -o yaml | grep schedule`"
        tips:
          - type: "info"
            title: "Nomes e Namespaces"
            content: "CronJobs, como todos os recursos do Kubernetes, são identificados de forma única pela combinação de seu nome e namespace."
          - type: "warning"
            title: "Timezone"
            content: "CronJobs operam usando o UTC como timezone padrão, não o fuso horário local do seu cluster. Considere isso ao agendar tarefas."
          - type: "tip"
            title: "Testando Expressões Cron"
            content: "Ferramentas como 'cronexpressiondescriptor.com' ou 'crontab.guru' podem ajudar a verificar e entender expressões cron."
          - type: "info"
            title: "Documentação oficial"
            content: "CronJob: [kubernetes.io/docs/concepts/workloads/controllers/cron-jobs](https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/)"
        validation:
          - command: "kubectl api-resources 2>/dev/null | grep -qi 'cronjob' && echo cronjobs || echo fail"
            expectedOutput: "cronjobs"
            errorMessage: "API de CronJobs não encontrada no cluster. Verifique se o cluster está em execução."

      - name: "Criando seu Primeiro CronJob"
        description: "Crie um CronJob simples que execute uma tarefa a cada minuto e observe seu comportamento."
        steps:
          - "**Criando um CronJob de Exemplo:**"
          - "Crie um CronJob básico que exibe a data e hora a cada minuto. Este exemplo ajudará a entender o ciclo de vida de um CronJob e como monitorá-lo."
          - "Um CronJob declarativo (YAML) tem os campos abaixo. Este é o manifesto completo de referência (mostrado para leitura — não precisa digitar; mais adiante você cria o mesmo objeto com um comando imperativo):"
          - |
            ```yaml
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: hello
            spec:
              schedule: "*/1 * * * *"          # expressão cron: a cada minuto
              successfulJobsHistoryLimit: 3    # quantas execuções OK manter
              failedJobsHistoryLimit: 1        # quantas execuções com falha manter
              concurrencyPolicy: Allow         # Allow | Forbid | Replace
              jobTemplate:                     # o molde do Job criado a cada execução
                spec:
                  template:
                    spec:
                      restartPolicy: OnFailure # OnFailure | Never
                      containers:
                      - name: hello
                        image: busybox
                        command: ["/bin/sh", "-c", "date; echo 'Ola do Kubernetes CronJob'"]
            ```
          - "Entenda os principais campos: schedule é a expressão cron que define quando o Job roda; successfulJobsHistoryLimit e failedJobsHistoryLimit controlam quantos Jobs anteriores (bem-sucedidos e com falha) são mantidos; concurrencyPolicy define como lidar com uma nova execução quando a anterior ainda roda — Allow (padrão, permite simultâneas), Forbid (impede nova enquanto a atual roda) ou Replace (cancela a atual e inicia outra); jobTemplate é o modelo do Job; restartPolicy define como lidar com falhas de Pods (OnFailure ou Never)."
          - "No terminal web, digitar YAML indentado à mão é frágil. Crie este CronJob de forma prática com o comando imperativo kubectl create cronjob, que monta o objeto a partir de flags simples. Copie e execute:"
          - "`kubectl create cronjob hello --image=busybox --schedule=\"*/1 * * * *\" -- /bin/sh -c 'date; echo \"Ola do Kubernetes CronJob\"'`"
          - "Esse comando cria um CronJob chamado hello que executa a cada minuto (schedule */1), usando a imagem busybox e rodando o comando informado após o separador --. Os campos avançados que você viu na descrição (successfulJobsHistoryLimit, concurrencyPolicy, etc.) recebem valores padrão quando o objeto é criado por esse comando — o importante agora é entender o ciclo de vida do CronJob."
          - "Vamos agora verificar se o CronJob foi criado:"
          - "`kubectl get cronjobs`"
          - "A saída mostra uma linha para o CronJob hello com as colunas NAME, SCHEDULE (*/1 * * * *), SUSPEND (False), ACTIVE, LAST SCHEDULE e AGE."
          - "Como o CronJob está agendado para executar a cada minuto, aguarde um momento e verifique novamente:"
          - "`kubectl get cronjobs`"
          - "Agora a coluna LAST SCHEDULE deve estar preenchida, indicando quando o CronJob foi executado pela última vez."
          - "**Examinando Jobs e Pods Criados:**"
          - "Cada execução do CronJob cria um Job. Vamos verificar os Jobs criados:"
          - "`kubectl get jobs`"
          - "Você verá Jobs com nomes que seguem o padrão hello-<timestamp>."
          - "Agora, vamos examinar os Pods criados pelos Jobs:"
          - "`kubectl get pods`"
          - "**Verificando os Logs:**"
          - "Para ver a saída do seu CronJob, obtenha o nome do Pod mais recente e verifique seus logs:"
          - "`POD_NAME=$(kubectl get pods --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}')`"
          - "`kubectl logs $POD_NAME`"
          - "Você deve ver a data e a mensagem 'Ola do Kubernetes CronJob'."
        tips:
          - type: "warning"
            title: "Limpeza Automática"
            content: "O controlador de CronJobs limpa automaticamente os Jobs concluídos com base nos limites de histórico definidos. Sem estes limites, seu cluster pode acumular muitos objetos desnecessários."
          - type: "info"
            title: "Suspendendo CronJobs"
            content: "Se precisar interromper temporariamente um CronJob sem excluí-lo, você pode suspendê-lo com kubectl patch cronjob hello -p (definindo spec.suspend como true)."
          - type: "tip"
            title: "Configuração de Recursos"
            content: "Para CronJobs em produção, sempre defina limites de recursos (CPU/memória) para garantir estabilidade do cluster."
        validation:
          - command: "kubectl get cronjobs | grep -q hello && echo 'CronJob encontrado' || echo 'CronJob não encontrado'"
            expectedOutput: "CronJob encontrado"
            errorMessage: "O CronJob 'hello' não foi criado corretamente."
          - command: "kubectl get jobs --no-headers 2>/dev/null | grep -q . && echo ok || echo fail"
            expectedOutput: "ok"
            errorMessage: "Nenhum Job foi criado pelo CronJob. Talvez seja necessário aguardar o próximo minuto."

      - name: "Gerenciando CronJobs"
        description: "Aprenda a monitorar, modificar e solucionar problemas com CronJobs."
        steps:
          - "**Monitorando CronJobs**"
          - "O monitoramento adequado dos CronJobs é essencial para garantir que suas tarefas agendadas estejam funcionando conforme esperado."
          - "Para uma visão detalhada do seu CronJob, use o comando:"
          - "`kubectl describe cronjob hello`"
          - "Preste atenção na seção 'Events', que registra as ações recentes realizadas pelo controlador do CronJob."
          - "**Verificando o Histórico de Execuções:**"
          - "Como configuramos nosso CronJob para manter um histórico, podemos ver as execuções anteriores:"
          - "`kubectl get jobs --selector=job-name`"
          - "**Editando um CronJob Existente:**"
          - "Vamos modificar o agendamento do nosso CronJob para que ele seja executado a cada 2 minutos, em vez de a cada minuto. Em vez de abrir um editor interativo (frágil no terminal web), aplique a alteração direto com patch:"
          - "`kubectl patch cronjob hello -p '{\"spec\":{\"schedule\":\"*/2 * * * *\"}}'`"
          - "Verifique se a alteração foi aplicada:"
          - "`kubectl get cronjob hello -o jsonpath='{.spec.schedule}'`"
          - "A saída deve mostrar o novo agendamento: */2 * * * *"
          - "**Acionando um CronJob Manualmente:**"
          - "Você também pode criar um Job a partir do modelo do CronJob a qualquer momento, sem esperar pelo agendamento:"
          - "`kubectl create job --from=cronjob/hello hello-manual`"
          - "Verifique se o novo Job foi criado:"
          - "`kubectl get jobs`"
          - "E examine os logs do Pod criado:"
          - "`POD_NAME=$(kubectl get pods --selector=job-name=hello-manual -o jsonpath='{.items[0].metadata.name}')`"
          - "`kubectl logs $POD_NAME`"
          - "**Pausando e Retomando CronJobs:**"
          - "Se você precisar interromper temporariamente as execuções agendadas, pode suspender o CronJob:"
          - "`kubectl patch cronjob hello -p '{\"spec\":{\"suspend\":true}}'`"
          - "Verifique se o CronJob foi suspenso:"
          - "`kubectl get cronjob hello`"
          - "A coluna SUSPEND deve mostrar 'True'."
          - "Para retomar o agendamento:"
          - "`kubectl patch cronjob hello -p '{\"spec\":{\"suspend\":false}}'`"
          - "**Excluindo um CronJob:**"
          - "Quando não precisar mais do CronJob, você pode excluí-lo junto com todos os seus Jobs associados:"
          - "`kubectl delete cronjob hello`"
          - "Verifique se todos os Jobs relacionados também foram excluídos:"
          - "`kubectl get jobs --selector=job-name`"
        tips:
          - type: "tip"
            title: "Práticas Recomendadas"
            content: "Para tarefas críticas, implemente alertas com base no status de conclusão dos Jobs para ser notificado sobre falhas."
          - type: "warning"
            title: "Proteção contra Falhas"
            content: "Configure timeouts (activeDeadlineSeconds no spec.jobTemplate) para evitar que Jobs fiquem presos indefinidamente em caso de problemas."
          - type: "info"
            title: "Documentação oficial"
            content: "Job: [kubernetes.io/docs/concepts/workloads/controllers/job](https://kubernetes.io/docs/concepts/workloads/controllers/job/)"
        validation:
          - command: "kubectl get cronjob hello 2>/dev/null || echo 'CronJob removido'"
            expectedOutput: "CronJob removido"
            errorMessage: "O CronJob 'hello' não foi excluído corretamente."

      - name: "Implementando CronJobs para Aplicações Reais"
        description: "Crie um CronJob mais complexo que simula um cenário de backup de banco de dados."
        steps:
          - "**Cenário: Backup de Banco de Dados**"
          - "Neste exercício, vamos criar um CronJob que simula o backup diário de um banco de dados às 2h da manhã. Como não temos um banco de dados real, vamos simular este processo."
          - "Um CronJob de backup declarativo (YAML) usaria, além do schedule 0 2 * * * (2h da manhã), campos avançados: startingDeadlineSeconds (prazo máximo, em segundos, para o Job ainda iniciar após o horário agendado), definição de resources (requests e limits de CPU e memória) e um script de várias etapas no jobTemplate. O manifesto completo de referência está na documentação do repositório."
          - "Entenda os campos avançados: startingDeadlineSeconds é o tempo máximo após o horário agendado em que o Job ainda pode começar; a definição de resources (CPU e memória) limita o que o Job pode consumir; e o script mais complexo simula várias etapas de um processo de backup."
          - "No terminal web, digitar YAML indentado à mão é frágil. Crie o CronJob de forma prática com o comando imperativo, que simula as etapas do backup no comando após o separador --:"
          - "`kubectl create cronjob database-backup --image=busybox --schedule=\"0 2 * * *\" -- /bin/sh -c 'echo \"Iniciando backup em $(date)\"; echo \"Criando dump...\"; sleep 3; echo \"Compactando...\"; sleep 2; echo \"Backup concluido em $(date)\"'`"
          - "Este comando cria o CronJob database-backup agendado para as 2h da manhã (0 2 * * *). O comando após o -- simula as etapas de um backup real (dump, compactação). Os campos avançados do YAML de referência (limites de recursos, startingDeadlineSeconds) recebem padrões — em produção, você aplicaria o YAML completo para defini-los."
          - "**Para fins de teste (já que não vamos esperar até às 2h da manhã):**"
          - "Vamos criar um Job manualmente a partir deste CronJob:"
          - "`kubectl create job --from=cronjob/database-backup database-backup-test`"
          - "Acompanhe o progresso do Job:"
          - "`kubectl get jobs`"
          - "Examine os logs para ver a simulação do processo de backup:"
          - "`POD_NAME=$(kubectl get pods --selector=job-name=database-backup-test -o jsonpath='{.items[0].metadata.name}')`"
          - "`kubectl logs $POD_NAME`"
          - "Você verá a saída simulando as etapas do backup (início, dump, compactação, conclusão). Na próxima tarefa você fará a limpeza de todos os recursos criados no laboratório."
        tips:
          - type: "info"
            title: "Volumes em CronJobs"
            content: "Em cenários reais de backup, você adicionaria volumes ao seu CronJob para armazenar os dados de backup, como um PersistentVolumeClaim ou um volume de armazenamento em nuvem."
          - type: "warning"
            title: "Segurança em CronJobs"
            content: "Para acessar recursos protegidos como bancos de dados, use Secrets do Kubernetes para armazenar credenciais e monte-os no container como variáveis de ambiente ou arquivos."
          - type: "info"
            title: "Documentação oficial"
            content: "CronJob (campos avançados): [kubernetes.io/docs/concepts/workloads/controllers/cron-jobs](https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/)"
        validation:
          - command: "kubectl get cronjob database-backup 2>/dev/null | grep -q database-backup && echo ok || echo fail"
            expectedOutput: "ok"
            errorMessage: "O CronJob 'database-backup' não foi criado corretamente. Rode o comando kubectl create cronjob database-backup acima."

      - name: "Limpeza dos Recursos"
        description: "Remova todos os recursos criados durante o laboratório, entendendo como o Kubernetes gerencia o ciclo de vida de CronJobs, Jobs e Pods."
        steps:
          - "Depois de explorar os CronJobs, vamos limpar todos os recursos criados para manter o cluster organizado. Ao longo do lab você criou dois CronJobs (hello e database-backup) e Jobs derivados deles."
          - "**1. Removendo os CronJobs**"
          - "Liste os CronJobs criados:"
          - "`kubectl get cronjobs`"
          - "Remova os dois CronJobs (o --ignore-not-found evita erro se algum já tiver sido removido):"
          - "`kubectl delete cronjob hello database-backup --ignore-not-found`"
          - "Ao remover um CronJob, o Kubernetes também remove os Jobs e Pods que ele gerou (propriedade em cascata)."
          - "**2. Removendo Jobs de teste remanescentes**"
          - "Se você criou um Job manual de teste, remova-o também:"
          - "`kubectl delete job database-backup-test --ignore-not-found`"
          - "**3. Confirmando a limpeza**"
          - "Verifique que não sobrou nenhum CronJob nem Job do laboratório:"
          - "`kubectl get cronjobs,jobs`"
          - "Você deve ver 'No resources found' — o ambiente está limpo. Este é o ciclo de vida completo: criar, usar e remover recursos."
        tips:
          - type: "warning"
            title: "Cascata de exclusão"
            content: "Excluir um CronJob remove automaticamente os Jobs e Pods filhos que ele criou. Para preservar Jobs já concluídos ao excluir o CronJob, use a flag --cascade=orphan."
          - type: "info"
            title: "--ignore-not-found"
            content: "A flag --ignore-not-found faz o kubectl não retornar erro se o recurso já não existir, tornando o comando de limpeza idempotente."
        validation:
          - command: "kubectl get cronjobs --no-headers 2>/dev/null | grep -Ec 'hello|database-backup' | grep -qx 0 && echo ok || echo fail"
            expectedOutput: "ok"
            errorMessage: "Ainda há CronJobs do laboratório. Remova-os com kubectl delete cronjob hello database-backup --ignore-not-found"
