# ============================================================================
# Lab GIRUS — Metrics Server: como funciona, como se instala  (k3s ARM64)
# ============================================================================
# AUTORIA: KubeForge (conteúdo próprio). Mesmo schema dos demais labs:
#          steps=[]string, validação por igualdade exata (==), comandos
#          imperativos (kubectl run/create --overrides) porque o terminal web
#          achata YAML multi-linha colado.
#
# FORMATO A + C (comprovado em probe no cluster real como a SA do aluno
# system:serviceaccount:lab-test-user:default):
#   - A SA NÃO é cluster-admin: NÃO pode instalar o metrics-server de verdade
#     (criar Deployment/APIService/ClusterRole em kube-system é negado por RBAC),
#     e o metrics-server JÁ roda e é COMPARTILHADO (o kube-10 depende dele) —
#     mexer nele quebraria os outros labs. Então o lab NÃO instala o real.
#   - PARTE C (leitura + observação do REAL): a SA PODE 'get deployments -n
#     kube-system' (medido: readyReplicas=1, image mirrored-metrics-server:v0.9.0,
#     args reais legíveis) e 'get nodes'. NÃO pode 'get apiservices' nem
#     'nodes.metrics.k8s.io' — por isso o APIService e o fluxo de instalação
#     real aparecem como BLOCO DE LEITURA, e a observação valida só o que a SA lê.
#   - PARTE A (mãos à obra, validável): o aluno sobe um "coletor simulado"
#     (um Deployment metrics-demo no PRÓPRIO namespace, que a SA pode criar —
#     medido: create deployment = yes) para praticar o fluxo de deploy de um
#     componente de plataforma. Validação lê .metadata.name e a imagem.
#
# GOTCHA DIDÁTICO: o flag --kubelet-insecure-tls é o erro clássico em k3s/kind
#   (metrics-server sobe mas 'top' falha com erro de TLS). ESTE cluster NÃO usa
#   esse flag — usa --kubelet-use-node-status-port — então o lab mostra o flag
#   canônico como leitura E observa os args reais, ensinando que varia por cluster.
#
# IMAGEM DO ALUNO: alpine/k8s:1.33.1 (bash+kubectl+helm, multi-arch ARM64).
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-metrics-server-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: |
    name: kubernetes-metrics-server
    title: "[Opcional] Lab 11 — Metrics Server: como funciona e como se instala"
    description: "O comando kubectl top (que você usou no Lab 10) só funciona porque existe um componente chamado metrics-server rodando no cluster. Neste lab você entende o que ele é, como a Metrics API é agregada ao API server, qual o fluxo real de instalação (incluindo a pegadinha do --kubelet-insecure-tls que todo mundo erra em k3s/kind), e observa o metrics-server que já roda neste cluster. Como instalar o metrics-server de verdade exige permissão de administrador (e ele é compartilhado por todos os labs), a parte prática usa um coletor SIMULADO no seu próprio namespace para você praticar o fluxo de deploy de um componente de plataforma, sem risco."
    duration: 25m
    image: "alpine/k8s:1.33.1"
    tasks:
      - name: "O que é o metrics-server e a Metrics API"
        description: "Entenda por que o kubectl top precisa de um componente extra e como ele se encaixa no API server."
        steps:
          - "**Por que o `kubectl top` precisa de ajuda**"
          - "O API server do Kubernetes NÃO coleta uso de CPU/memória por conta própria. Ele guarda o estado desejado (specs) e o status dos objetos — mas não métricas de consumo. Quando você roda `kubectl top pods`, o kubectl consulta a **Metrics API** (`metrics.k8s.io`), e quem responde por essa API é o **metrics-server**."
          - "**Como o metrics-server se encaixa (API Aggregation)**"
          - "O metrics-server é um Deployment (normalmente em `kube-system`) que:"
          - "- lê o uso de CPU/memória de cada nó pelo **Summary API do kubelet** (porta do kubelet em cada nó);"
          - "- agrega esses dados em memória (não guarda histórico — é um instantâneo);"
          - "- se registra no API server como um **APIService** (`v1beta1.metrics.k8s.io`), fazendo o API server ROTEAR as chamadas de `metrics.k8s.io` para ele. Isso se chama **API Aggregation Layer**."
          - "**O fluxo completo de uma chamada `kubectl top pods`:**"
          - "kubectl -> API server -> (vê que `metrics.k8s.io` é um APIService agregado) -> encaminha para o metrics-server -> que já tinha coletado do kubelet de cada nó -> devolve CPU/memória."
          - "Confirme que o cluster tem nós prontos (o metrics-server coleta de cada um deles):"
          - "`kubectl get nodes`"
        tips:
          - type: "info"
            title: "Instantâneo, não histórico"
            content: "O metrics-server guarda métricas só na memória e expõe o valor MAIS RECENTE. Ele serve o kubectl top e o HPA (autoscaler). Para gráficos e histórico você usa Prometheus/Grafana — outro componente, outro propósito."
          - type: "warning"
            title: "Sem metrics-server, nada de top nem HPA"
            content: "Se o metrics-server não estiver instalado, 'kubectl top' falha com 'Metrics API not available' e o Horizontal Pod Autoscaler fica sem dados para escalar. É um componente de plataforma, não opcional em produção."
        validation:
          - command: "test $(kubectl get nodes --no-headers 2>/dev/null | wc -l | tr -d ' ') -ge 1 && echo ok || echo fail"
            expectedOutput: "ok"
            errorMessage: "Não foi possível listar os nós do cluster. Rode 'kubectl get nodes'."

      - name: "Observe o metrics-server REAL deste cluster"
        description: "Leia o Deployment do metrics-server que já roda em kube-system e entenda seus argumentos de verdade."
        steps:
          - "**O metrics-server deste cluster já está instalado**"
          - "Este cluster (k3s) já traz um metrics-server rodando em `kube-system` — é ele que fez o `kubectl top` do Lab 10 funcionar. Vamos observá-lo (você tem permissão de leitura em `kube-system`, mas não de alteração — e é bom que seja assim: ele é compartilhado por todos os labs)."
          - "Veja que ele está pronto (quantas réplicas prontas):"
          - "`kubectl get deployment metrics-server -n kube-system`"
          - "**Leia os argumentos reais do container** — é aqui que mora a configuração de como ele fala com o kubelet:"
          - "`kubectl get deployment metrics-server -n kube-system -o jsonpath='{.spec.template.spec.containers[0].args}'; echo`"
          - "**A pegadinha do TLS do kubelet (`--kubelet-insecure-tls`)**"
          - "O metrics-server conecta no kubelet de cada nó por HTTPS. Em muitos clusters (kind, k3s mal configurado, kubeadm sem SANs certos) o certificado do kubelet não bate com o nome/IP que o metrics-server usa — e a conexão falha com erro de TLS. O sintoma clássico: o Pod do metrics-server sobe (`Running`), mas `kubectl top` responde `metrics not available`. A correção canônica é adicionar o flag `--kubelet-insecure-tls` aos args (desliga a verificação do certificado do kubelet). **ATENÇÃO:** em produção isso é um alívio de laboratório, não a solução correta — o certo é configurar certificados de kubelet válidos."
          - "**Observe:** nos args reais acima, verifique se ESTE cluster usa `--kubelet-insecure-tls`. (Neste k3s ele NÃO usa — resolve o mesmo problema com `--kubelet-use-node-status-port`. Isso mostra que a configuração do metrics-server VARIA por tipo de cluster.)"
          - "**O manifesto oficial de instalação (apenas para LER)** — o `components.yaml` upstream instala, de uma vez: um ServiceAccount, ClusterRoles/Bindings (para ler métricas dos nós), o Deployment, um Service e o APIService que agrega a Metrics API. A versão enxuta dos pontos que importam:"
          - "```yaml\n# trecho do metrics-server/components.yaml (apenas leitura)\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: metrics-server\n  namespace: kube-system\nspec:\n  template:\n    spec:\n      containers:\n      - name: metrics-server\n        image: registry.k8s.io/metrics-server/metrics-server:v0.7.2\n        args:\n          - --cert-dir=/tmp\n          - --secure-port=10250\n          - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname\n          - --kubelet-use-node-status-port\n          - --metric-resolution=15s\n          # --kubelet-insecure-tls   # <- adicione ESTA linha em kind/k3s se top falhar por TLS\n---\napiVersion: apiregistration.k8s.io/v1\nkind: APIService\nmetadata:\n  name: v1beta1.metrics.k8s.io   # <- é isto que agrega a Metrics API ao API server\nspec:\n  service:\n    name: metrics-server\n    namespace: kube-system\n  group: metrics.k8s.io\n  version: v1beta1\n```"
          - "A instalação real de um comando só seria: `kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml` — mas isso exige permissão de administrador (criar objetos em `kube-system` e um APIService cluster-scoped), que a SA deste lab não tem de propósito. Na próxima tarefa você pratica o FLUXO de deploy com um coletor simulado no seu namespace."
        tips:
          - type: "tip"
            title: "Como diagnosticar um metrics-server quebrado"
            content: "Se 'kubectl top' falha: 1) o Pod do metrics-server está Running? (kubectl get deploy metrics-server -n kube-system) 2) os logs dele mostram erro de TLS falando com o kubelet? -> precisa de --kubelet-insecure-tls ou certs válidos 3) o APIService v1beta1.metrics.k8s.io está Available=True?"
          - type: "info"
            title: "k3s traz o seu próprio"
            content: "O k3s empacota uma versão espelhada do metrics-server (mirrored-metrics-server) e já o habilita por padrão. Por isso neste cluster o 'kubectl top' funcionou sem você instalar nada."
        validation:
          - command: "kubectl get deployment metrics-server -n kube-system -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo ''"
            expectedOutput: "1"
            errorMessage: "Não foi possível ler o Deployment metrics-server em kube-system. Rode 'kubectl get deployment metrics-server -n kube-system'."
          - command: "kubectl get deployment metrics-server -n kube-system -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null | grep -qi 'kubelet' && echo ok || echo fail"
            expectedOutput: "ok"
            errorMessage: "Leia os argumentos do container com 'kubectl get deployment metrics-server -n kube-system -o jsonpath=...{.args}' — eles devem conter flags de kubelet."

      - name: "Pratique o fluxo de deploy: um coletor simulado no seu namespace"
        description: "Como você não pode instalar o metrics-server real, suba um Deployment 'coletor' no seu próprio namespace para praticar o fluxo de deploy de um componente de plataforma."
        steps:
          - "**Por que simulado**"
          - "Instalar o metrics-server de verdade exige administrador e mexeria no componente compartilhado. Então aqui você sobe um **Deployment que USA A MESMA IMAGEM do metrics-server**, no seu próprio namespace, só para exercitar o fluxo: criar o Deployment, conferir que subiu, inspecioná-lo. Ele não vai agregar a Metrics API (isso exigiria o APIService cluster-scoped que a SA não cria) — o objetivo é o FLUXO de deploy, não ligar a API."
          - "**O manifesto (apenas para LER):**"
          - "```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: metrics-demo\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: metrics-demo\n  template:\n    metadata:\n      labels:\n        app: metrics-demo\n    spec:\n      containers:\n      - name: metrics-server\n        image: registry.k8s.io/metrics-server/metrics-server:v0.7.2\n        args: [\"--help\"]   # só para o container iniciar sem precisar falar com o kubelet\n```"
          - "Crie o Deployment com o comando abaixo:"
          - "`kubectl create deployment metrics-demo --image=registry.k8s.io/metrics-server/metrics-server:v0.7.2`"
          - "**Confirme que o Deployment foi criado** (leia o nome):"
          - "`kubectl get deployment metrics-demo -o jsonpath='{.metadata.name}'; echo`"
          - "**Veja a imagem que você usou** — é a mesma imagem do metrics-server real:"
          - "`kubectl get deployment metrics-demo -o jsonpath='{.spec.template.spec.containers[0].image}'; echo`"
          - "**Compare mentalmente:** o metrics-demo que você acabou de subir é um Deployment comum no seu namespace. O metrics-server real difere em três coisas que exigem admin: (1) roda em `kube-system`, (2) tem ClusterRole para ler métricas de TODOS os nós, (3) registra o APIService `v1beta1.metrics.k8s.io` que agrega a Metrics API. É essa agregação que faz o `kubectl top` funcionar — e é exatamente a parte que precisa de administrador."
        tips:
          - type: "info"
            title: "Fluxo de deploy de componente de plataforma"
            content: "Instalar um add-on de cluster (metrics-server, ingress-controller, cert-manager) é sempre o mesmo padrão: um Deployment + RBAC para o que ele precisa ler/escrever + um ponto de integração (Service, APIService, Webhook). Você praticou o passo do Deployment aqui."
        validation:
          - command: "kubectl get deployment metrics-demo -o jsonpath='{.metadata.name}' 2>/dev/null || echo ''"
            expectedOutput: "metrics-demo"
            errorMessage: "O Deployment metrics-demo não foi encontrado. Rode 'kubectl create deployment metrics-demo --image=registry.k8s.io/metrics-server/metrics-server:v0.7.2'."
          - command: "kubectl get deployment metrics-demo -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | grep -c metrics-server"
            expectedOutput: "1"
            errorMessage: "A imagem do metrics-demo não é a do metrics-server. Recrie com a imagem registry.k8s.io/metrics-server/metrics-server:v0.7.2."

      - name: "Limpeza"
        description: "Remova o coletor simulado que você criou para deixar o namespace limpo."
        steps:
          - "**Remova o Deployment do seu namespace**"
          - "O metrics-server REAL em kube-system NÃO deve ser tocado (ele é compartilhado). Remova apenas o coletor simulado que você criou:"
          - "`kubectl delete deployment metrics-demo`"
          - "Confirme que saiu:"
          - "`kubectl get deployment metrics-demo 2>&1 | tail -1`"
        tips:
          - type: "warning"
            title: "Nunca mexa no metrics-server de kube-system"
            content: "Apagar ou alterar o metrics-server real quebraria o 'kubectl top' e o HPA para TODOS os labs. A SA deste lab nem conseguiria (RBAC) — mas vale a regra: componentes compartilhados de kube-system são intocáveis fora de uma janela de manutenção com admin."
        validation:
          - command: "kubectl get deployment metrics-demo 2>/dev/null >/dev/null && echo exists || echo gone"
            expectedOutput: "gone"
            errorMessage: "O Deployment metrics-demo ainda existe. Rode 'kubectl delete deployment metrics-demo'."
