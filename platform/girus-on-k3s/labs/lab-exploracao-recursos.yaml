# Lab GIRUS — Exploração de Recursos no Kubernetes  (adaptado para o nosso k3s ARM64)
# ============================================================================
# ORIGEM: girus-cli (LINUXtips) — internal/templates/manifests/lab_08_kubernetes_exploracao-recursos.yaml
#         github.com/badtuxx/girus-cli  ·  Licença GPL-3.0
# Todo o crédito do conteúdo (tasks/validação) é da LINUXtips e contribuidores.
#
# MODIFICAÇÃO NOSSA (declarada como exige a GPL):
#   - image do ambiente do aluno trocada para 'alpine/k8s:1.33.1' (multi-arch, ARM64).
#     Este lab não usa Kind aninhado — roda kubectl contra o cluster hospedeiro
#     (o nosso k3s) via a ServiceAccount girus-sa.
#
# NOTA: o pod-terminal do Girus roda '/bin/bash -c tail -f /dev/null'; alpine/k8s
#       tem bash + kubectl + helm + curl, cobrindo os passos que pedem shell.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-exploracao-recursos-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: |
    name: kubernetes-exploracao-recursos
    title: "Lab 5 — Explorando Recursos do Kubernetes com kubectl"
    description: "Neste desafio, você demonstrará suas habilidades na utilização do kubectl para gerenciar e inspecionar recursos em um cluster Kubernetes."
    duration: 15m
    timerEnabled: false
    maxDuration: 20m
    image: "alpine/k8s:1.33.1"
    tasks:
      - name: "Desafio 1: Configurar um Ambiente de Trabalho"
        description: "Configure um namespace isolado e crie os recursos iniciais necessários."
        steps:
          - "Neste desafio você vai montar o ambiente de trabalho. Abaixo de cada objetivo há o comando pronto — clique no botão de copiar e cole no terminal."
          - "1. Crie o namespace desafio-ns:"
          - "`kubectl create namespace desafio-ns`"
          - "Verifique que ele está ativo:"
          - "`kubectl get namespace desafio-ns`"
          - "2. Crie o pod nginx-pod com a imagem nginx:1.21-alpine no namespace desafio-ns:"
          - "`kubectl run nginx-pod --image=nginx:1.21-alpine -n desafio-ns`"
          - "3. Crie o ConfigMap nginx-config no namespace desafio-ns com a chave SERVER_TYPE=nginx:"
          - "`kubectl create configmap nginx-config -n desafio-ns --from-literal=SERVER_TYPE=nginx`"
        tips:
          - type: "warning"
            title: "Nomes dos Recursos"
            content: "Utilize exatamente os nomes especificados para cada recurso. A validação verificará esses nomes específicos."
        validation:
          - command: "kubectl get namespace desafio-ns -o jsonpath='{.metadata.name}' 2>/dev/null || echo ''"
            expectedOutput: "desafio-ns"
            errorMessage: "O namespace 'desafio-ns' não foi criado corretamente."
          - command: "kubectl get pod -n desafio-ns -o jsonpath='{.items[?(@.metadata.name==\"nginx-pod\")].spec.containers[0].image}' 2>/dev/null || echo ''"
            expectedOutput: "nginx:1.21-alpine"
            errorMessage: "Não foi encontrado o pod 'nginx-pod' com a imagem 'nginx:1.21-alpine' no namespace 'desafio-ns'."
          - command: "kubectl get configmap -n desafio-ns nginx-config -o jsonpath='{.data.SERVER_TYPE}' 2>/dev/null || echo ''"
            expectedOutput: "nginx"
            errorMessage: "O ConfigMap 'nginx-config' não foi criado corretamente com a chave 'SERVER_TYPE'."

      - name: "Desafio 2: Deployments e Serviços"
        description: "Crie e inspecione deployments e serviços, demonstrando entendimento de como os recursos do Kubernetes se relacionam."
        steps:
          - "Agora você vai criar um deployment e expô-lo com um serviço. Os comandos prontos estão abaixo de cada objetivo."
          - "1. Crie o deployment web-app com a imagem httpd:2.4-alpine e 3 réplicas no namespace desafio-ns:"
          - "`kubectl create deployment web-app --image=httpd:2.4-alpine --replicas=3 -n desafio-ns`"
          - "Adicione a label app=web ao deployment (o create deployment já aplica um selector próprio; esta label é a pedida no desafio):"
          - "`kubectl label deployment web-app app=web -n desafio-ns --overwrite`"
          - "2. Exponha o deployment com um serviço ClusterIP web-service na porta 80:"
          - "`kubectl expose deployment web-app --name=web-service --type=ClusterIP --port=80 -n desafio-ns`"
          - "3. Escale o deployment web-app para 5 réplicas:"
          - "`kubectl scale deployment web-app --replicas=5 -n desafio-ns`"
          - "4. Inspecione o resultado — veja o ClusterIP do serviço e se os pods estão rodando:"
          - "`kubectl get service web-service -n desafio-ns`"
          - "`kubectl get pods -n desafio-ns -l app=web`"
        tips:
          - type: "info"
            title: "Verificando Seletores"
            content: "Certifique-se de que o serviço utiliza o seletor correto para encontrar os pods do deployment. A correspondência é feita usando labels."
        validation:
          - command: "kubectl get deployment -n desafio-ns web-app -o jsonpath='{.spec.replicas}' 2>/dev/null || echo ''"
            expectedOutput: "5"
            errorMessage: "O deployment 'web-app' não foi criado corretamente ou não possui 5 réplicas."
          - command: "kubectl get deployment -n desafio-ns web-app -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo ''"
            expectedOutput: "httpd:2.4-alpine"
            errorMessage: "O deployment 'web-app' não está usando a imagem 'httpd:2.4-alpine'."
          - command: "kubectl get service -n desafio-ns web-service -o jsonpath='{.spec.type}' 2>/dev/null || echo ''"
            expectedOutput: "ClusterIP"
            errorMessage: "O serviço 'web-service' não foi criado ou não é do tipo ClusterIP."
          - command: "kubectl get service -n desafio-ns web-service -o jsonpath='{.spec.ports[0].port}' 2>/dev/null || echo ''"
            expectedOutput: "80"
            errorMessage: "O serviço 'web-service' não está configurado para a porta 80."

      - name: "Desafio 3: Diagnóstico e Solução de Problemas"
        description: "Diagnostique e resolva problemas em um pod com falha, demonstrando habilidades de troubleshooting."
        steps:
          - "Neste desafio você vai criar um pod com uma imagem inválida, diagnosticar a falha e corrigi-la."
          - "1. Crie o pod problem-pod com uma imagem inexistente (de propósito) no namespace desafio-ns:"
          - "`kubectl run problem-pod --image=nginx:invalid-version -n desafio-ns`"
          - "2. Diagnostique o problema — aguarde alguns segundos e inspecione o pod. Veja a seção Events no fim da saída (vai indicar erro de pull da imagem, ImagePullBackOff ou ErrImagePull):"
          - "`kubectl describe pod problem-pod -n desafio-ns`"
          - "3. Corrija o problema. Um pod não pode ter a imagem trocada em execução — é preciso excluir e recriar. Remova o pod com falha:"
          - "`kubectl delete pod problem-pod -n desafio-ns`"
          - "Recrie com a imagem correta nginx:stable-alpine:"
          - "`kubectl run problem-pod --image=nginx:stable-alpine -n desafio-ns`"
          - "4. Confirme que o pod está Running:"
          - "`kubectl get pod problem-pod -n desafio-ns`"
        tips:
          - type: "warning"
            title: "Como Corrigir um Pod"
            content: "Pods não podem ser atualizados diretamente. Você precisará excluir o pod com problema e criar um novo com a configuração correta."
        validation:
          - command: "kubectl get pod -n desafio-ns problem-pod -o jsonpath='{.status.phase}' 2>/dev/null || echo ''"
            expectedOutput: "Running"
            errorMessage: "O pod 'problem-pod' não está no estado 'Running'."
          - command: "kubectl get pod -n desafio-ns problem-pod -o jsonpath='{.spec.containers[0].image}' 2>/dev/null || echo ''"
            expectedOutput: "nginx:stable-alpine"
            errorMessage: "O pod 'problem-pod' não está usando a imagem corrigida 'nginx:stable-alpine'."

      - name: "Desafio 4: Limpeza Seletiva"
        description: "Demonstre sua capacidade de remover recursos específicos sem afetar todo o ambiente."
        steps:
          - "Neste último desafio você vai remover recursos específicos, mantendo outros ativos — demonstrando limpeza seletiva."
          - "1. Remova apenas o pod nginx-pod (sem tocar nos demais):"
          - "`kubectl delete pod nginx-pod -n desafio-ns`"
          - "2. Remova o deployment web-app. Ao excluir o deployment, o Kubernetes remove automaticamente todos os pods que ele gerencia (propriedade em cascata):"
          - "`kubectl delete deployment web-app -n desafio-ns`"
          - "Confirme que os pods do web-app sumiram:"
          - "`kubectl get pods -n desafio-ns -l app=web`"
          - "3. Mantenha o pod problem-pod e o serviço web-service ativos — não os remova."
          - "4. Liste o que restou no namespace para conferir (devem sobrar problem-pod e web-service):"
          - "`kubectl get all -n desafio-ns`"
        tips:
          - type: "info"
            title: "Verificação Pós-Remoção"
            content: "Use 'kubectl get all -n desafio-ns' para verificar quais recursos ainda existem no namespace."
        validation:
          - command: "kubectl get pod -n desafio-ns nginx-pod 2>&1 | grep -qi 'not found' && echo 'not found' || echo 'existe'"
            expectedOutput: "not found"
            errorMessage: "O pod 'nginx-pod' não foi removido corretamente."
          - command: "kubectl get deployment -n desafio-ns web-app 2>&1 | grep -qi 'not found' && echo 'not found' || echo 'existe'"
            expectedOutput: "not found"
            errorMessage: "O deployment 'web-app' não foi removido corretamente."
          - command: "kubectl get pod -n desafio-ns problem-pod -o jsonpath='{.metadata.name}' 2>/dev/null || echo ''"
            expectedOutput: "problem-pod"
            errorMessage: "O pod 'problem-pod' foi removido, mas deveria continuar existindo."
          - command: "kubectl get service -n desafio-ns web-service -o jsonpath='{.metadata.name}' 2>/dev/null || echo ''"
            expectedOutput: "web-service"
            errorMessage: "O serviço 'web-service' foi removido, mas deveria continuar existindo."
