# ============================================================================
# Lab GIRUS — Deployments no Kubernetes  (adaptado para o nosso k3s ARM64)
# ============================================================================
# ORIGEM: girus-cli (LINUXtips) — internal/templates/manifests/
#         lab_42_kubernetes_deployment.yaml
#         github.com/badtuxx/girus-cli  ·  Licença GPL-3.0
# Todo o crédito do conteúdo (tasks/validação) é da LINUXtips e contribuidores.
#
# MODIFICAÇÃO NOSSA (declarada como exige a GPL):
#   - image: 'linuxtips/girus-kind-single-node:0.1' (amd64-only) trocada por
#     'alpine/k8s:1.33.1' (multi-arch, roda no Graviton/ARM64). Este lab
#     não usa Kind aninhado — só roda kubectl contra o cluster hospedeiro (o
#     nosso k3s), via a ServiceAccount girus-sa. Por isso a troca é segura.
#
# NOTA: o pod-terminal do Girus roda '/bin/bash -c tail -f /dev/null'; alpine/k8s
#       tem bash + kubectl + helm + curl, cobrindo os passos que pedem shell.
#
# Aplicar:  kubectl apply -f labs/lab-deployment.yaml   (namespace girus)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-deployment-lab
  namespace: girus
  labels:
    app: girus-lab-template
data:
  lab.yaml: |
    name: kubernetes-deployment
    title: "Lab 1 — Deployments no Kubernetes"
    description: "Neste desafio, você precisa demonstrar seu conhecimento prático de Deployments no Kubernetes, criando e gerenciando recursos conforme solicitado."
    duration: 15m
    timerEnabled: false
    maxDuration: 20m
    image: "alpine/k8s:1.33.1"
    tasks:
      - name: "Desafio 1: Criar um Deployment do Nginx"
        description: "Crie um deployment do Nginx com as especificações solicitadas"
        steps:
          - "Crie um namespace chamado 'challenge-namespace'"
          - "Crie um deployment do Nginx com as seguintes características:"
          - "- Nome: nginx-deployment"
          - "- Namespace: challenge-namespace"
          - "- Imagem: nginx:1.20"
          - "- Replicas: 2"
          - "- Label: app=nginx-challenge"
          - "Verifique se o deployment foi criado corretamente e está rodando."
          - "Dica: a validação exige selector app=nginx-challenge, que o `kubectl create deployment` não define sozinho. Comandos de referência (uma linha cada, pode copiar):"
          - "`kubectl create namespace challenge-namespace`"
          - "`kubectl create deployment nginx-deployment --image=nginx:1.20 --replicas=2 -n challenge-namespace --dry-run=client -o yaml | sed 's/app: nginx-deployment/app: nginx-challenge/g' | kubectl apply -f -`"
          - "`kubectl get deployment nginx-deployment -n challenge-namespace -o wide`"
        tips:
          - type: "info"
            title: "Documentação oficial"
            content: "Deployments no Kubernetes: [kubernetes.io/docs/concepts/workloads/controllers/deployment](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/)"
          - type: "info"
            title: "Recursos necessários"
            content: "Para este desafio, você precisará utilizar os recursos Namespace e Deployment do Kubernetes."
          - type: "warning"
            title: "Validação"
            content: "Certifique-se de que os recursos estão exatamente como especificado para passar nas validações, incluindo nomes e labels."
        validation:
          - command: "kubectl get namespace challenge-namespace -o name 2>/dev/null || echo ''"
            expectedOutput: "namespace/challenge-namespace"
            errorMessage: "O namespace 'challenge-namespace' não foi criado ou está incorreto."
          - command: "kubectl get deployment nginx-deployment -n challenge-namespace -o jsonpath='{.spec.replicas}' 2>/dev/null || echo ''"
            expectedOutput: "2"
            errorMessage: "O deployment 'nginx-deployment' não foi criado corretamente ou não possui 2 réplicas."
          - command: "kubectl get deployment nginx-deployment -n challenge-namespace -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo ''"
            expectedOutput: "nginx:1.20"
            errorMessage: "A imagem do container no deployment não é nginx:1.20"
          - command: "kubectl get deployment nginx-deployment -n challenge-namespace -o jsonpath='{.spec.selector.matchLabels.app}' 2>/dev/null || echo ''"
            expectedOutput: "nginx-challenge"
            errorMessage: "O selector/label 'app=nginx-challenge' não está configurado corretamente."

      - name: "Desafio 2: Escalar e Atualizar um Deployment"
        description: "Modifique o deployment existente conforme solicitado"
        steps:
          - "Escale o deployment 'nginx-deployment' para 4 réplicas"
          - "Atualize a imagem do deployment para nginx:1.21"
          - "Adicione uma anotação ao deployment: maintainer=devops-team"
          - "Dica (comandos de referência — uma linha cada, pode copiar):"
          - "`kubectl scale deployment nginx-deployment --replicas=4 -n challenge-namespace`"
          - "Nota: o '*' abaixo atualiza a imagem de todos os containers do pod — evita ter que saber o nome exato do container (as aspas protegem o '*' do shell)."
          - "`kubectl set image deployment/nginx-deployment '*'=nginx:1.21 -n challenge-namespace`"
          - "`kubectl annotate deployment nginx-deployment maintainer=devops-team -n challenge-namespace --overwrite`"
        tips:
          - type: "info"
            title: "Documentação oficial"
            content: "Escalar e atualizar Deployments: [kubernetes.io/docs/concepts/workloads/controllers/deployment](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#scaling-a-deployment)"
          - type: "warning"
            title: "Comandos corretos"
            content: "Certifique-se de utilizar os comandos corretos para escalar e atualizar o deployment. Há múltiplas formas de fazer isso, algumas mais adequadas que outras."
          - type: "info"
            title: "Verificação"
            content: "Após aplicar as mudanças, verifique se foram implementadas corretamente."
        validation:
          - command: "kubectl get deployment nginx-deployment -n challenge-namespace -o jsonpath='{.spec.replicas}' 2>/dev/null || echo ''"
            expectedOutput: "4"
            errorMessage: "O deployment 'nginx-deployment' não foi escalado para 4 réplicas."
          - command: "kubectl get deployment nginx-deployment -n challenge-namespace -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo ''"
            expectedOutput: "nginx:1.21"
            errorMessage: "A imagem do container no deployment não foi atualizada para nginx:1.21"
          - command: "kubectl get deployment nginx-deployment -n challenge-namespace -o jsonpath='{.metadata.annotations.maintainer}' 2>/dev/null || echo ''"
            expectedOutput: "devops-team"
            errorMessage: "A anotação 'maintainer=devops-team' não foi adicionada ao deployment."

      - name: "Desafio 3: Criar um Service para o Deployment"
        description: "Exponha o deployment criado através de um Service"
        steps:
          - "Crie um Service com as seguintes características:"
          - "- Nome: nginx-service"
          - "- Namespace: challenge-namespace"
          - "- Tipo: NodePort"
          - "- Porto do serviço: 80"
          - "- Porta do container alvo: 80"
          - "- Deve selecionar os pods do deployment 'nginx-deployment'"
          - "Verifique se o service foi criado e está corretamente configurado."
          - "Dica (comandos de referência — uma linha cada, pode copiar):"
          - "`kubectl expose deployment nginx-deployment --name=nginx-service --type=NodePort --port=80 --target-port=80 -n challenge-namespace`"
          - "`kubectl get service nginx-service -n challenge-namespace`"
        tips:
          - type: "info"
            title: "Documentação oficial"
            content: "Services no Kubernetes: [kubernetes.io/docs/concepts/services-networking/service](https://kubernetes.io/docs/concepts/services-networking/service/)"
          - type: "info"
            title: "Seletores"
            content: "Lembre-se que o service usa seletores para identificar os pods que deve encaminhar tráfego."
          - type: "tip"
            title: "Verificação"
            content: "Você pode verificar se o service está funcionando tentando acessar a URL via curl ou verificando os endpoints."
        validation:
          - command: "kubectl get service nginx-service -n challenge-namespace -o name 2>/dev/null || echo ''"
            expectedOutput: "service/nginx-service"
            errorMessage: "O service 'nginx-service' não foi criado."
          - command: "kubectl get service nginx-service -n challenge-namespace -o jsonpath='{.spec.type}' 2>/dev/null || echo ''"
            expectedOutput: "NodePort"
            errorMessage: "O service não é do tipo NodePort."
          - command: "kubectl get service nginx-service -n challenge-namespace -o jsonpath='{.spec.ports[0].port}' 2>/dev/null || echo ''"
            expectedOutput: "80"
            errorMessage: "A porta do service não é 80."
          - command: "kubectl get service nginx-service -n challenge-namespace -o jsonpath='{.spec.selector.app}' 2>/dev/null || echo ''"
            expectedOutput: "nginx-challenge"
            errorMessage: "O service não está selecionando pods com o label 'app=nginx-challenge'."

      - name: "Desafio 4: Criar um ConfigMap e atualizar o Deployment"
        description: "Configure um ConfigMap e modifique o deployment para utilizá-lo"
        steps:
          - "Crie um ConfigMap com as seguintes características:"
          - "- Nome: nginx-config"
          - "- Namespace: challenge-namespace"
          - "- Deve conter uma chave 'index.html' com o valor exato: desafio-ok"
          - "Dica: crie de forma imperativa (evita YAML multi-linha e acentos):"
          - "`kubectl create configmap nginx-config -n challenge-namespace --from-literal=index.html=desafio-ok`"
          - "Modifique o deployment para montar o ConfigMap como um volume em /usr/share/nginx/html/"
          - "Dica: monte o volume com um patch (evita editar YAML no terminal). Comando de referência (uma linha, pode copiar):"
          - "`kubectl patch deployment nginx-deployment -n challenge-namespace --type json -p '[{\"op\":\"add\",\"path\":\"/spec/template/spec/volumes\",\"value\":[{\"name\":\"config-volume\",\"configMap\":{\"name\":\"nginx-config\"}}]},{\"op\":\"add\",\"path\":\"/spec/template/spec/containers/0/volumeMounts\",\"value\":[{\"name\":\"config-volume\",\"mountPath\":\"/usr/share/nginx/html/\"}]}]'`"
          - "Verifique se a configuração foi aplicada corretamente."
        tips:
          - type: "info"
            title: "Documentação oficial"
            content: "ConfigMaps no Kubernetes: [kubernetes.io/docs/concepts/configuration/configmap](https://kubernetes.io/docs/concepts/configuration/configmap/)"
          - type: "warning"
            title: "Volumes e montagens"
            content: "Você precisará adicionar uma seção de volumes ao deployment e uma volumeMount ao container."
          - type: "info"
            title: "Validação"
            content: "A validação verificará se o ConfigMap existe e se está montado corretamente no deployment."
        validation:
          - command: "kubectl get configmap nginx-config -n challenge-namespace -o jsonpath='{.data.index\\.html}' 2>/dev/null || echo ''"
            expectedOutput: "desafio-ok"
            errorMessage: "O ConfigMap 'nginx-config' não foi criado corretamente ou não contém a chave 'index.html' com o valor esperado."
          - command: "kubectl get deployment nginx-deployment -n challenge-namespace -o jsonpath='{.spec.template.spec.volumes[0].configMap.name}' 2>/dev/null || echo ''"
            expectedOutput: "nginx-config"
            errorMessage: "O deployment não tem um volume configurado com o ConfigMap 'nginx-config'."
          - command: "kubectl get deployment nginx-deployment -n challenge-namespace -o jsonpath='{.spec.template.spec.containers[0].volumeMounts[0].mountPath}' 2>/dev/null || echo ''"
            expectedOutput: "/usr/share/nginx/html/"
            errorMessage: "O volume do ConfigMap não está montado em '/usr/share/nginx/html/' no container."

      - name: "Desafio 5: Limpeza do ambiente"
        description: "Remova os recursos criados para devolver o cluster limpo"
        steps:
          - "Boa prática: ao concluir um trabalho no cluster, remova o que você criou."
          - "Remova o namespace 'challenge-namespace' (isso apaga o Deployment, o Service e o ConfigMap de uma vez):"
          - "`kubectl delete namespace challenge-namespace`"
          - "Aguarde a remoção terminar e verifique que o namespace não existe mais."
        tips:
          - type: "info"
            title: "Documentação oficial"
            content: "Namespaces no Kubernetes: [kubernetes.io/docs/concepts/overview/working-with-objects/namespaces](https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/)"
          - type: "info"
            title: "Por que limpar"
            content: "Deletar o namespace remove em cascata todos os recursos dentro dele (Deployment, Service, ConfigMap). É a forma mais limpa de encerrar o exercício."
          - type: "warning"
            title: "A remoção é assíncrona"
            content: "O 'kubectl delete namespace' pode levar alguns segundos (estado Terminating). Se o VERIFICAR falhar logo após, aguarde a remoção concluir e tente de novo."
        validation:
          - command: "kubectl get namespace challenge-namespace -o name 2>/dev/null || echo 'removido'"
            expectedOutput: "removido"
            errorMessage: "O namespace 'challenge-namespace' ainda existe. Execute 'kubectl delete namespace challenge-namespace' e aguarde a remoção concluir."
