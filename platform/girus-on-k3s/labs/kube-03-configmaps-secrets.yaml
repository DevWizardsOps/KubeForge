#     Este lab não usa Kind aninhado — roda kubectl contra o cluster hospedeiro
#     (o nosso k3s) via a ServiceAccount girus-sa.
#   - Removidos os blocos de código YAML/JSON de referência e as crases inline do
#     texto dos steps: o frontend do Girus renderiza qualquer trecho em crase como
#     um chip copiável isolado, então manifestos multi-linha e nomes em crase viravam
#     chips inúteis. O comando imperativo (kubectl run --overrides / printf) que já
#     seguia cada manifesto foi preservado. Negrito (**...**) é renderizado como texto
#     e foi mantido.
#
# NOTA: o pod-terminal do Girus roda '/bin/bash -c tail -f /dev/null'; alpine/k8s
#       tem bash + kubectl + helm + curl, cobrindo os passos que pedem shell.
