# ============================================================================
# Ingress TLS para o frontend do GIRUS — mesmo padrão do LAB 02.
# ============================================================================
# Dá ao Girus uma URL HTTPS estável e válida (Let's Encrypt), coisa que o Kind
# local do CLI oficial não tem. Reusa o Traefik (embutido no k3s) + o
# cert-manager e o ClusterIssuer 'letsencrypt-prod' que o LAB 02 já instalou.
#
# HOSTNAME via WILDCARD: este manifesto usa o placeholder '__KUBEFORGE_HOST__',
# materializado pelo ./configure.sh a partir de KUBEFORGE_HOST (o hostname que
# VOCÊ configurou no LAB 01 — não assuma um domínio específico). O Girus usa
# 'girus.<KUBEFORGE_HOST>', então o seu DNS precisa de um registro WILDCARD
# '*.<KUBEFORGE_HOST>' apontando para o IP do server (o Traefik roteia pelo
# header Host:). Padrão da trilha: cada serviço ganha '<nome>.<KUBEFORGE_HOST>'.
#
# PRÉ-REQUISITOS:
#   - LAB 01: cluster k3s + registro wildcard '*.<KUBEFORGE_HOST>' no seu DNS
#     (A -> IP do server).
#   - LAB 02: cert-manager + ClusterIssuer 'letsencrypt-prod' Ready.
#
# ⚠️ NÃO edite o host à mão aqui. Defina KUBEFORGE_HOST (kubeforge.env) e rode
#    ./configure.sh — ele gera 02-girus-ingress.rendered.yaml com o host real.
#
# Nota: o wildcard cobre UM nível (*.<KUBEFORGE_HOST>), então
# 'girus.<KUBEFORGE_HOST>' resolve; nomes com nível extra não.
#
# Aplicar:  ./configure.sh && kubectl apply -f 02-girus-ingress.rendered.yaml
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: girus-frontend
  namespace: girus
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # NOTA: a annotation do basic-auth NÃO fica aqui de propósito. Ligá-la antes
    # do cert sair faria o Traefik responder 401 no /.well-known/acme-challenge,
    # travando a validação HTTP-01. O auth entra DEPOIS do cert Ready — ver o
    # passo final em 03-girus-auth.yaml / README (kubectl annotate).
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - girus.__KUBEFORGE_HOST__
      secretName: girus-frontend-tls
  rules:
    - host: girus.__KUBEFORGE_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: girus-frontend
                port:
                  number: 80
