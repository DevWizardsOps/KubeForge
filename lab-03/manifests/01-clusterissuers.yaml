# ClusterIssuers do Let's Encrypt — emitem certificados via ACME HTTP-01.
#
# Dois issuers: STAGING (ilimitado, cert NÃO confiável no browser — use para
# validar o fluxo) e PROD (cert confiável, mas limite de 5/semana por domínio).
# SEMPRE valide no staging primeiro; só troque o Ingress para o prod quando o
# staging emitir com sucesso.
#
# Solver: HTTP-01 pela classe de Ingress 'traefik' (o k3s já traz o Traefik).
#
# ⚠️ Troque o e-mail abaixo pelo SEU (o Let's Encrypt manda avisos de expiração).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: SEU_EMAIL@exemplo.com          # <-- TROQUE
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: SEU_EMAIL@exemplo.com          # <-- TROQUE
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
