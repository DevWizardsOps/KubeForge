# Ingress com TLS automático via cert-manager.
#
# A anotação cert-manager.io/cluster-issuer diz ao cert-manager para emitir um
# cert para os hosts do bloco tls[] e guardá-lo no secret 'whoami-tls'.
# O Traefik (Ingress Controller embutido no k3s) serve o app em HTTPS com esse cert.
#
# ⚠️ NÃO edite o host à mão. Este manifesto usa o placeholder '__KUBEFORGE_HOST__':
#   defina KUBEFORGE_HOST (kubeforge.env, na raiz do repo) e rode ./configure.sh
#   — ele gera 03-whoami-ingress.rendered.yaml com o SEU hostname (o do LAB 01).
#   Comece validando o cert com o ClusterIssuer de staging; só use
#   'letsencrypt-prod' após o staging emitir (READY=True em 'kubectl get certificate').
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # prod (validado após o staging)
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - __KUBEFORGE_HOST__
      secretName: whoami-tls
  rules:
    - host: __KUBEFORGE_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
