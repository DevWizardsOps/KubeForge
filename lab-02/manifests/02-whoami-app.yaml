# App de exemplo: whoami (traefik/whoami) — responde com headers/host/IP, ótimo
# para provar que o Ingress + TLS estão roteando. Imagem multi-arch (ARM64 OK).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  labels: { app: whoami }
spec:
  replicas: 2
  selector:
    matchLabels: { app: whoami }
  template:
    metadata:
      labels: { app: whoami }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  selector: { app: whoami }
  ports:
    - port: 80
      targetPort: 80
